name: Deployed dev sync

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-dev-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_API_BASE_URL: https://dev.saltmarshdata.org
      E2E_REQUIRED: "1"
      E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
      E2E_CONTRIBUTOR_EMAIL: ${{ secrets.E2E_CONTRIBUTOR_EMAIL }}
      E2E_CONTRIBUTOR_PASSWORD: ${{ secrets.E2E_CONTRIBUTOR_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
      E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4

      - name: Run the app's real sync code against the deployed dev site
        run: |
          flutter pub get
          flutter test test/sync_integration
